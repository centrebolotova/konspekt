<title>Конспект</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: shelf of notebooks → two-pane workspace (source | ruled paper); panes stack top/bottom in portrait */
:root{
  --bg:#E8EBEE; --surface:#FFFFFF; --surface-2:#F3F5F7; --fg:#17202A; --muted:#5A6672; --line:#D2D8DE;
  --accent:#2A54C6; --accent-ink:#FFFFFF; --accent-soft:#E2E9FA; --danger:#B3261E; --danger-ink:#FFFFFF;
  --stage:#0F1216; --stage-fg:#C9D1DA;
  /* the paper is a physical object: same look in both themes */
  --paper:#FDFDF9; --rule:#DAE3EE; --margin:#ECB6AC; --paper-ink:#17202A; --chip-bg:#E2E9FA; --chip-fg:#2A54C6;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgba(20,30,45,.08),0 4px 18px rgba(20,30,45,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101419; --surface:#19202A; --surface-2:#212934; --fg:#E4E9EF; --muted:#97A3AF; --line:#2C3541;
  --accent:#88A7FF; --accent-ink:#0C1220; --accent-soft:#243150; --danger:#FF8A80; --danger-ink:#2A0B08;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 22px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101419; --surface:#19202A; --surface-2:#212934; --fg:#E4E9EF; --muted:#97A3AF; --line:#2C3541;
  --accent:#88A7FF; --accent-ink:#0C1220; --accent-soft:#243150; --danger:#FF8A80; --danger-ink:#2A0B08;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 22px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap;font-size:14px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.38;cursor:default}
.btn:focus-visible,.tool:focus-visible,.sw:focus-visible,.sz:focus-visible,.card:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select.btn{padding-right:6px}

/* ---------- library ---------- */
#library{height:100%;overflow:auto;padding:28px 16px 48px}
.lib-head{max-width:1120px;margin:0 auto 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lib-head h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.02em;margin:0;line-height:1.1}
.lib-head p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.shelf{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;box-shadow:var(--shadow);min-width:0}
.card canvas{display:block;width:100%;aspect-ratio:4/3;background:var(--paper);border-bottom:1px solid var(--line)}
.card .meta{padding:10px 8px 10px 12px;display:flex;align-items:center;gap:6px;min-width:0}
.card .txt{min-width:0;flex:1}
.card .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s{color:var(--muted);font-size:13px}
.card.new{align-items:center;justify-content:center;gap:10px;min-height:200px;border-style:dashed;background:transparent;box-shadow:none;color:var(--accent);font-weight:600}
.card.new svg.i{width:30px;height:30px}
.del.confirm{background:var(--danger);color:var(--danger-ink);border-color:var(--danger);width:auto;padding:0 10px}

/* ---------- editor ---------- */
#editor{height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.title-in{flex:1;min-width:140px;font-weight:600;font-size:17px;border:0;background:transparent;padding:6px 8px;border-radius:6px}
.title-in:focus{outline:2px solid var(--accent-soft)}
.split{flex:1;min-height:0;display:flex;--split:48%}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column}
#srcPane{flex:0 0 var(--split);background:var(--surface-2)}
#notePane{flex:1 1 0}
#divider{flex:0 0 12px;cursor:col-resize;background:var(--bg);display:grid;place-items:center;touch-action:none}
#divider::after{content:"";width:4px;height:44px;border-radius:2px;background:var(--line)}
@media (orientation:portrait),(max-width:720px){
  .split{flex-direction:column}
  #divider{cursor:row-resize}
  #divider::after{width:44px;height:4px}
}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage.dark{background:var(--stage)}
.stage video,.stage iframe{width:100%;height:100%;border:0;display:block;background:var(--stage);object-fit:contain}
.ctrl{display:flex;align-items:center;gap:6px;padding:8px 12px;flex-wrap:wrap;background:var(--surface);border-top:1px solid var(--line)}
.ctrl .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:4.5em}
.grow{flex:1}
.chooser{width:100%;max-width:560px;padding:24px 16px;display:flex;flex-direction:column;gap:14px;overflow:auto;max-height:100%}
.ch-title{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.ch-msg{margin:0;color:var(--danger);font-size:14px}
.ch-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left}
.opt:hover{border-color:var(--accent)}
.opt svg.i{width:26px;height:26px;color:var(--accent);margin-bottom:4px}
.opt span{color:var(--muted);font-size:13px}
.yt{display:flex;flex-direction:column;gap:6px}
.yt label{font-weight:500;font-size:14px}
.yt-row{display:flex;gap:8px}
.yt-row input{flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface)}
.yt-fb{position:absolute;left:12px;right:12px;bottom:12px;background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:var(--shadow)}
.yt-fb a{color:var(--accent)}
.loading{color:var(--muted)}
.pdf-scroll{position:relative;width:100%;height:100%;overflow:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px;-webkit-overflow-scrolling:touch}
.pdf-page{width:100%;max-width:900px;background:#fff;box-shadow:var(--shadow);flex:none}
.pdf-page canvas{display:block;width:100%;height:100%}

.ntools{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tools{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:10px}
.tool{width:40px;height:34px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.tool[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.swatches,.sizes{display:flex;gap:6px;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.sz{width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer}
.sz i{display:block;border-radius:50%;background:var(--fg)}
.sz[aria-pressed="true"]{border-color:var(--line);background:var(--surface-2)}
.hint{color:var(--muted);font-size:13px;min-width:0;flex:1 1 160px}

.scroller{flex:1;min-height:0;overflow:auto;padding:20px 16px 90px;position:relative;-webkit-overflow-scrolling:touch}
.paper{position:relative;margin:0 auto;background-color:var(--paper);box-shadow:var(--shadow);
  background-image:
    linear-gradient(90deg,transparent var(--mx),var(--margin) var(--mx),var(--margin) calc(var(--mx) + 1px),transparent calc(var(--mx) + 1px)),
    repeating-linear-gradient(180deg,transparent 0 calc(var(--rule-h) - 1px),var(--rule) calc(var(--rule-h) - 1px) var(--rule-h));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overflow:hidden}
.paper.m-select,.paper.m-text{touch-action:pan-y}
.paper canvas{position:absolute;left:0;top:0;pointer-events:none}
.layer{position:absolute;inset:0;pointer-events:none}
.pbreak{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--line)}
.pnum{position:absolute;right:10px;font-size:11px;color:#8C97A3;font-variant-numeric:tabular-nums}
.item{position:absolute;pointer-events:none}
.m-select .item,.m-text .item{pointer-events:auto;touch-action:none}
.m-text .item.text{touch-action:auto}
.item .tx{display:block;color:var(--paper-ink);white-space:pre-wrap;word-break:break-word;outline:none;min-height:1em;-webkit-user-select:text;user-select:text}
.m-text .item.text .tx{cursor:text;box-shadow:0 0 0 1px var(--rule);border-radius:3px;min-width:3em}
.m-text .item.text .tx:focus{box-shadow:0 0 0 2px var(--accent)}
.item.img img{display:block;width:100%;border-radius:4px;pointer-events:none;-webkit-user-drag:none}
.chip{display:inline-flex;align-items:center;gap:.3em;padding:.12em .6em .12em .45em;border-radius:999px;background:var(--chip-bg);color:var(--chip-fg);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.4}
.chip svg{width:1em;height:1em;fill:currentColor;stroke:none}
.item.stamp{cursor:pointer}
.item.img .chip{position:absolute;left:6px;bottom:6px;font-size:13px}
.m-select .item.sel{outline:2px dashed var(--accent);outline-offset:4px}
.item .x,.item .handle{display:none}
.m-select .item.sel .x{display:grid;place-items:center;position:absolute;right:-14px;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--danger);color:var(--danger-ink);border:2px solid var(--paper);font-size:16px;line-height:1;cursor:pointer;padding:0}
.m-select .item.sel .handle{display:block;position:absolute;right:-10px;bottom:-10px;width:20px;height:20px;border-radius:50%;background:var(--accent);border:2px solid var(--paper);cursor:nwse-resize}
.m-select .item{cursor:grab}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;z-index:10}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:#2E9E5B}.dot.busy{background:var(--accent)}.dot.err{background:var(--danger)}
#syncDlg{position:fixed;inset:0;z-index:20;background:rgba(10,15,22,.45);display:grid;place-items:center;padding:16px}
.dlg{width:100%;max-width:420px;background:var(--surface);color:var(--fg);border-radius:14px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.dlg h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.dlg p{margin:0;color:var(--muted);font-size:14px}
.dlg label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:500}
.dlg input{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface-2)}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap}
.dlg .err{color:var(--danger);font-size:14px}
.dlg .who{font-weight:600;word-break:break-all}
@media (max-width:520px){.btn .lbl{display:none}.btn:has(.lbl){padding:0 9px}}
</style>

<div id="library" hidden>
  <div class="lib-head">
    <div>
      <h1>Конспект</h1>
      <p>Видео, YouTube или PDF слева, рукописный конспект справа. Каждая запись помнит минуту видео.</p>
    </div>
    <div class="head-actions">
      <button class="btn" id="syncBtn" type="button" hidden></button>
      <button class="btn primary" id="newBtn" type="button"></button>
    </div>
  </div>
  <div class="shelf" id="shelf"></div>
</div>

<div id="editor" hidden>
  <div class="topbar">
    <button class="btn" id="backBtn" type="button"></button>
    <input class="title-in" id="titleIn" aria-label="Название тетради" autocomplete="off">
    <button class="btn icon" id="syncMini" type="button" aria-label="Синхронизация" title="Синхронизация" hidden></button>
    <button class="btn icon" id="undoBtn" type="button" aria-label="Отменить" title="Отменить"></button>
    <button class="btn icon" id="redoBtn" type="button" aria-label="Повторить" title="Повторить"></button>
  </div>
  <div class="split" id="split">
    <section class="pane" id="srcPane" aria-label="Источник">
      <div class="stage" id="stage"></div>
      <div class="ctrl" id="ctrl" hidden></div>
    </section>
    <div id="divider" role="separator" aria-label="Граница панелей"></div>
    <section class="pane" id="notePane" aria-label="Конспект">
      <div class="ntools">
        <div class="tools" id="tools" role="group" aria-label="Инструменты"></div>
        <div class="swatches" id="swatches"></div>
        <div class="sizes" id="sizes"></div>
        <span class="hint" id="hint"></span>
        <button class="btn" id="pageBtn" type="button"></button>
      </div>
      <div class="scroller" id="scroller">
        <div class="paper" id="paper">
          <div class="layer" id="breaks"></div>
          <div class="layer" id="items"></div>
          <canvas id="base"></canvas>
          <canvas id="live"></canvas>
        </div>
      </div>
    </section>
  </div>
</div>
<input type="file" id="fVideo" accept="video/*" hidden>
<input type="file" id="fPdf" accept="application/pdf,.pdf" hidden>
<div id="syncDlg" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="syncTitle" id="syncBody"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const PAPER_W = 1000, PAGE_H = 1414, RULE = 44, MARGIN = 84;
const PEN_COLORS = ['#17202A', '#2A54C6', '#C62828', '#2E7D32', '#7B3FB8'];
const MARK_COLORS = ['#F5C842', '#7DDBA8', '#F79CB8', '#8CC4FF'];
const SIZES = { pen: [2.4, 4, 7], marker: [18, 28, 42] };
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
// Синхронизация через Supabase: адрес проекта и публичный ключ (Settings → API). Пусто — синхронизация выключена.
const SYNC = { url: '', key: '' };
const SB_LIB = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';

const I = (d, extra='') => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true" ${extra}>${d}</svg>`;
const ICON = {
  back: I('<path d="M15 5l-7 7 7 7"/>'),
  plus: I('<path d="M12 5v14M5 12h14"/>'),
  pen: I('<path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/>'),
  marker: I('<path d="M8 14l-4 5h6l1.5-2"/><path d="M8 14l8-10 4 3-8 10z"/>'),
  eraser: I('<path d="M9 20h11"/><path d="M4.6 15.4l8.8-8.8a2 2 0 012.8 0l2.2 2.2a2 2 0 010 2.8L12 18H7.2z"/>'),
  text: I('<path d="M5 6h14M12 6v13M9 19h6"/>'),
  select: I('<path d="M6 3l12 8.5-5.2 1 3.2 6-2.2 1.2-3.2-6L6 17.5z"/>'),
  undo: I('<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>'),
  redo: I('<path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/>'),
  play: I('<path d="M7 5l12 7-12 7z" fill="currentColor"/>'),
  pause: I('<path d="M8 5v14M16 5v14" stroke-width="3"/>'),
  clock: I('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'),
  cam: I('<rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l2-3h4l2 3"/>'),
  swap: I('<path d="M4 8h13l-3-3M20 16H7l3 3"/>'),
  video: I('<rect x="3" y="5" width="13" height="14" rx="2"/><path d="M16 10l5-3v10l-5-3"/>'),
  pdf: I('<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>'),
  page: I('<path d="M6 3h12v18H6z"/><path d="M12 9v6M9 12h6"/>'),
  trash: I('<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>'),
};
const tri = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z"/></svg>';

const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = t => { t = Math.max(0, Math.floor(t || 0)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
const refLabel = r => r.t != null ? fmt(r.t) : 'стр. ' + r.pg;
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

/* ---------- toast ---------- */
let toastT;
function toast(msg, ms = 2200) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms); }

/* ---------- storage (IndexedDB, memory fallback) ---------- */
let dbp = null, mem = null;
function openDB() {
  return dbp ||= new Promise((res, rej) => {
    try {
      const r = indexedDB.open('konspekt', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('notes', { keyPath: 'id' }); r.result.createObjectStore('files'); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
    } catch (e) { rej(e); }
  });
}
async function idb(name, mode, fn) {
  const d = await openDB();
  return new Promise((res, rej) => { const t = d.transaction(name, mode); const req = fn(t.objectStore(name)); t.oncomplete = () => res(req.result); t.onerror = t.onabort = () => rej(t.error); });
}
function toMemory(e) {
  console.warn(e);
  if (!mem) { mem = { notes: new Map(), files: new Map() }; toast('Память браузера недоступна: записи сохранятся только до закрытия страницы', 6000); }
}
const store = {
  async all() { if (!mem) try { return await idb('notes', 'readonly', s => s.getAll()); } catch (e) { toMemory(e); } return [...mem.notes.values()]; },
  async put(n) { if (!mem) try { return await idb('notes', 'readwrite', s => s.put(n)); } catch (e) { toMemory(e); } mem.notes.set(n.id, n); },
  async del(id) { if (!mem) try { await idb('notes', 'readwrite', s => s.delete(id)); await idb('files', 'readwrite', s => s.delete(id)); return; } catch (e) { toMemory(e); } mem.notes.delete(id); mem.files.delete(id); },
  async putFile(id, f) { if (mem) { mem.files.set(id, f); return true; } try { await idb('files', 'readwrite', s => s.put(f, id)); return true; } catch (e) { console.warn(e); return false; } },
  async getFile(id) { if (mem) return mem.files.get(id); try { return await idb('files', 'readonly', s => s.get(id)); } catch (e) { console.warn(e); return null; } },
};
const sessionFiles = new Map();

/* ---------- state ---------- */
let notes = [], note = null, src = null, objURL = null, loadTok = 0;
let tool = 'pen', penColor = PEN_COLORS[0], markColor = MARK_COLORS[0], penSize = 1, markSize = 1;
let undoS = [], redoS = [], sel = null, penSeen = false;
let W = 800, s = 0.8, DPR = 1, viewTop = 0, viewH = 0;

/* ---------- layout ---------- */

/* ---------- undo ---------- */

function doUndo() { if (!undoS.length) return; redoS.push(snapshot()); restore(undoS.pop()); updUR(); }

/* ---------- items ---------- */

}

/* ---------- drawing input ---------- */

    if (st.pts.some(q => Math.hypot(q[0] - p[0], q[1] - p[1]) < m)) { note.strokes.splice(i, 1); hit = true; }

    if (p[0] < st.bb[0] - m || p[0] > st.bb[2] + m || p[1] < st.bb[1] - m || p[1] > st.bb[3] + m) continue;

/* ---------- toolbar ---------- */
const TOOLS = [

  ['text', 'Текст', ICON.text], ['select', 'Выбор и переход по записям', ICON.select],
];
const HINTS = {
  pen: () => penSeen ? 'Пишите Pencil, листайте пальцем' : '',
  marker: () => '',
  eraser: () => 'Проведите по штриху, чтобы стереть',
  text: () => 'Коснитесь листа и печатайте',
  select: () => 'Коснитесь записи, чтобы перемотать видео к её моменту',

    b.title = label; b.setAttribute('aria-label', label); b.setAttribute('aria-pressed', String(tool === k));

    for (const c of cols) {

      b.setAttribute('aria-label', 'Цвет ' + c); b.setAttribute('aria-pressed', String(c === curC));

/* ---------- sources ---------- */
function loadScript(url) { return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = url; sc.onload = res; sc.onerror = () => rej(new Error('Не загрузился ' + url)); document.head.append(sc); }); }
let pdfLib = null;
async function loadPdfLib() {

}

      c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);

}

    }
    for (const l of local) {
      const r = rmap.get(l.id); if (r && r.updated >= l.updated) continue;
      const row = { user_id: user.id, id: l.id, updated: l.updated, deleted: !!l.deleted, data: l.deleted ? null : l };
      const { error: e3 } = await sb.from('notes').upsert(row, { onConflict: 'user_id,id' }); if (e3) throw e3;
    }
    lastSync = Date.now(); syncState = 'ok'; syncErr = '';
    if (pulledOpen === 'deleted') { note = null; showLibrary(); toast('Эту тетрадь удалили на другом устройстве'); }
    else if (pulledOpen) reloadOpen(pulledOpen);
    if (!$('#library').hidden) await refreshShelf();
  } catch (e) {
    console.warn(e); syncState = 'err';
    syncErr = /fetch|network|load/i.test(e.message || '') ? 'Нет интернета, синхронизирую позже' : (e.message || String(e));
  } finally {
    syncing = false; renderSyncUI();
    if (syncAgain) { syncAgain = false; syncSoon(); }
  }
}
function reloadOpen(n) {
  const oldSrc = JSON.stringify(note.source || null), top = scroller.scrollTop;
  note = n; undoS = []; redoS = []; sel = null; updUR();
  $('#titleIn').value = n.title; layout(); scroller.scrollTop = top;
  if (JSON.stringify(n.source || null) !== oldSrc) loadSource();
  toast('Тетрадь обновлена с другого устройства');
}
function syncLabel() {
  if (!user) return 'Войти для синхронизации';
  if (syncState === 'busy') return 'Синхронизирую…';
  if (syncState === 'err') return syncErr || 'Ошибка синхронизации';
  if (lastSync) return 'Синхронизировано в ' + new Date(lastSync).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  return 'Синхронизация';
}
function renderSyncUI() {
  if (!SYNC.url) return;
  const cls = !user ? '' : syncState;
  $('#syncBtn').innerHTML = `<span class="dot ${cls}"></span>${CLOUD}<span class="lbl">${user ? 'Синхронизация' : 'Войти'}</span>`;
  $('#syncBtn').title = $('#syncMini').title = syncLabel();
  $('#syncMini').innerHTML = `<span class="dot ${cls}" style="position:absolute;margin:-14px 0 0 16px"></span>${CLOUD}`;
  $('#syncMini').style.position = 'relative';
  if (!$('#syncDlg').hidden) renderSyncDlg();
}
let dlgMsg = '';
function renderSyncDlg() {
  const b = $('#syncBody');
  if (!sb) { b.innerHTML = `<h2 id="syncTitle">Синхронизация</h2><p>${esc(syncErr || 'Подключаюсь…')}</p><div class="row"><button class="btn" type="button" data-a="close">Закрыть</button></div>`; }
  else if (!user) {
    b.innerHTML = `<h2 id="syncTitle">Синхронизация</h2>
      <p>Войдите, и тетради появятся на всех ваших устройствах. Видеофайлы не переносятся: на другом устройстве выберите видео заново, конспект подхватится.</p>
      <form id="authForm" class="dlg-form" style="display:flex;flex-direction:column;gap:10px">
        <label>Почта<input id="authEmail" type="email" autocomplete="username" required></label>
        <label>Пароль, от 6 символов<input id="authPass" type="password" autocomplete="current-password" minlength="6" required></label>
        ${dlgMsg ? `<p class="err">${esc(dlgMsg)}</p>` : ''}
        <div class="row"><button class="btn primary" type="submit" data-a="in">Войти</button><button class="btn" type="button" data-a="up">Создать аккаунт</button><button class="btn ghost" type="button" data-a="close">Закрыть</button></div>
      </form>`;
  } else {
    b.innerHTML = `<h2 id="syncTitle">Синхронизация</h2>
      <p>Вы вошли как</p><div class="who">${esc(user.email || '')}</div>
      <p${syncState === 'err' ? ' class="err"' : ''}>${esc(syncLabel())}</p>
      <div class="row"><button class="btn primary" type="button" data-a="now">Синхронизировать сейчас</button><button class="btn" type="button" data-a="out">Выйти</button><button class="btn ghost" type="button" data-a="close">Закрыть</button></div>`;
  }
  b.querySelectorAll('[data-a]').forEach(btn => { if (btn.type !== 'submit') btn.onclick = () => dlgAction(btn.dataset.a); });
  const f = $('#authForm'); if (f) f.onsubmit = e => { e.preventDefault(); dlgAction('in'); };
}
const authErr = m => /Invalid login/i.test(m) ? 'Неверная почта или пароль' : /already registered/i.test(m) ? 'Такой аккаунт уже есть. Нажмите «Войти»' : /at least 6/i.test(m) ? 'Пароль должен быть не короче 6 символов' : /Email not confirmed/i.test(m) ? 'Почта не подтверждена: откройте письмо и перейдите по ссылке' : m;
async function dlgAction(a) {
  if (a === 'close') { $('#syncDlg').hidden = true; dlgMsg = ''; return; }
  if (a === 'now') { syncNow(); return; }
  if (a === 'out') { await sb.auth.signOut(); user = null; syncState = 'off'; renderSyncUI(); return; }
  const email = ($('#authEmail').value || '').trim(), password = $('#authPass').value || '';
  if (!email || password.length < 6) { dlgMsg = 'Введите почту и пароль от 6 символов'; renderSyncDlg(); $('#authEmail').value = email; return; }
  dlgMsg = '';
  const res = a === 'up' ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  if (res.error) { dlgMsg = authErr(res.error.message); renderSyncDlg(); $('#authEmail').value = email; return; }
  if (!res.data.session) { dlgMsg = 'Мы отправили письмо: подтвердите почту и нажмите «Войти»'; renderSyncDlg(); $('#authEmail').value = email; return; }
  user = res.data.session.user; renderSyncUI(); toast('Готово, синхронизирую тетради'); syncNow();
}
function openSyncDlg() { $('#syncDlg').hidden = false; renderSyncDlg(); const e = $('#authEmail'); if (e) e.focus(); }
$('#syncBtn').onclick = openSyncDlg; $('#syncMini').onclick = openSyncDlg;
$('#syncDlg').addEventListener('click', e => { if (e.target.id === 'syncDlg') dlgAction('close'); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 90000);

/* ---------- start ---------- */
(async () => {
  setTool('pen');
  syncInit();
  notes = ((await store.all()) || []).filter(n => !n.deleted);
  if (!notes.length && !lsGet('kp-seeded')) {
    const n = sampleNote(); n.id = 'primer'; await store.put(n); notes = [n]; lsSet('kp-seeded', '1');
    openNote(n);
  } else showLibrary();
})();
})();
</script>
