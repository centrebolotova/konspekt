<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Конспект">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Конспект</title>
<style>
/* Layout: library = soft gradient ground + nav sidebar + big white panel; notebook = blue-tinted top bar, icon rail on the left, white pages scrolling down */
:root{
  --ground:linear-gradient(135deg,#E6EDFB 0%,#F1ECFA 48%,#E7F1FC 100%);
  --bg:#EEF2F8; --panel:#FFFFFF; --panel-2:#F5F7FB; --fg:#1C2533; --muted:#6B7686; --line:#E1E6EE;
  --accent:#1F7AE0; --accent-ink:#FFFFFF; --accent-soft:#E3EFFD;
  --bar:#DCEBFA; --bar-line:#C9DDF3; --ico:#1F7AE0; --ico-off:#9AA6B4; --ico-on:#1C2533;
  --danger:#D93025; --danger-ink:#FFFFFF; --ok:#1E9E5A;
  --desk:#F4F6F9;
  --shadow:0 1px 2px rgba(25,40,70,.06),0 6px 24px rgba(25,40,70,.08);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="dark"]{
  --ground:linear-gradient(135deg,#141A24 0%,#1A1726 50%,#121C26 100%);
  --bg:#121821; --panel:#1B222D; --panel-2:#232C38; --fg:#E7ECF3; --muted:#98A3B2; --line:#2E3846;
  --accent:#5AA2F5; --accent-ink:#0B1422; --accent-soft:#1E3352;
  --bar:#1C2A3B; --bar-line:#2A3B50; --ico:#6FB0FA; --ico-off:#6E7C8D; --ico-on:#E7ECF3;
  --danger:#FF7A70; --danger-ink:#2A0B08; --ok:#4CC38A; --desk:#161D27;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.4;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap;font-size:15px}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.icon{width:38px;padding:0}
.btn[disabled]{opacity:.4;cursor:default}
.ib{width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--ico);flex:none;position:relative}
.ib:hover{background:rgba(255,255,255,.45)}
.ib[disabled]{opacity:.35;cursor:default}
:is(.btn,.ib,.navb,.card,.fcard,.sw,.ptile,.menu-item,.seg button):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ico-off);position:absolute;right:6px;top:6px}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--accent)}.dot.err{background:var(--danger)}

/* ---------- library ---------- */
#library{height:100%;background:var(--ground);display:grid;grid-template-columns:270px minmax(0,1fr)}
.side{padding:26px 14px 18px;display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0}
.logo{display:flex;align-items:center;gap:8px;margin:0 10px 26px;color:var(--accent);font-weight:700;font-size:29px;letter-spacing:-.02em}
.logo svg{width:34px;height:34px;stroke-width:1.9}
.navb{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:12px;background:transparent;cursor:pointer;font-size:17px;text-align:left;color:var(--fg)}
.navb svg.i{width:24px;height:24px;color:var(--muted)}
.navb[aria-current="true"]{color:var(--accent);font-weight:600}
.navb[aria-current="true"] svg.i{color:var(--accent)}
.navb:hover{background:rgba(255,255,255,.4)}
.navb .cnt{margin-left:auto;font-size:13px;color:var(--muted);font-weight:400}
.tree-h{display:flex;align-items:center;justify-content:space-between;margin:18px 12px 4px;font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.fold-ico{width:22px;height:18px;border-radius:3px 5px 4px 4px;position:relative;flex:none}
.fold-ico::before{content:"";position:absolute;left:0;top:-3px;width:10px;height:5px;border-radius:2px 3px 0 0;background:inherit}
.side-bottom{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line)}
.main{margin:16px 16px 16px 0;background:var(--panel);border-radius:30px;overflow:auto;padding:30px 34px 120px;position:relative;box-shadow:var(--shadow);min-width:0}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:17px;margin-bottom:6px;flex-wrap:wrap}
.crumbs button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;padding:2px 0}
.mhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.mhead h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0;min-width:0;overflow-wrap:anywhere}
.mhead .ib{color:var(--muted)}
.mtools{margin-left:auto;display:flex;align-items:center;gap:4px}
.sortb{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-size:17px;cursor:pointer;padding:6px 8px;border-radius:8px}
.search{height:40px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--panel-2);width:min(260px,60vw)}
.sec-h{display:flex;align-items:center;gap:10px;margin:8px 0 14px;color:var(--muted);font-size:15px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.sec-h svg.i{width:20px;height:20px}
.sec-h .act{margin-left:auto;letter-spacing:.04em;font-size:14px;font-weight:600;border:0;background:none;color:var(--muted);cursor:pointer;text-transform:uppercase}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;margin-bottom:34px}
.fcard{display:flex;align-items:center;gap:18px;padding:18px 18px 18px 22px;border-radius:18px;background:var(--panel);box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;min-width:0;position:relative}
.fcard .big{width:62px;height:52px;border-radius:5px 8px 7px 7px;position:relative;flex:none;opacity:.92}
.fcard .big::before{content:"";position:absolute;left:0;top:-7px;width:26px;height:10px;border-radius:4px 6px 0 0;background:inherit}
.fcard .ft{min-width:0;flex:1}
.fcard .t{font-size:19px;font-weight:500;overflow-wrap:anywhere}
.fcard .d{color:var(--muted);font-size:14px;margin-top:2px}
.star{position:absolute;right:12px;top:10px;width:36px;height:36px;border:0;background:transparent;color:var(--ico-off);cursor:pointer;display:grid;place-items:center;border-radius:50%}
.star.on{color:#F5B400}
.star svg.i{width:24px;height:24px}
.more{border:0;background:none;color:var(--muted);cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;flex:none}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:26px 22px}
.card{display:flex;flex-direction:column;gap:10px;cursor:pointer;min-width:0;background:none;border:0;padding:0;text-align:left;border-radius:12px}
.thumb{position:relative;aspect-ratio:1/1.414;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(25,40,70,.12),0 6px 18px rgba(25,40,70,.08);border:1px solid var(--line)}
.thumb canvas{display:block;width:100%;height:100%}
.thumb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:linear-gradient(90deg,rgba(0,0,0,.08),transparent);z-index:1}
.thumb .star{right:6px;top:6px;background:rgba(255,255,255,.75)}
.card .cap{display:flex;align-items:flex-start;gap:4px;min-width:0}
.card .t{font-size:17px;flex:1;min-width:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .d{color:var(--muted);font-size:14px;margin-top:-6px}
.ngrid.list{grid-template-columns:1fr;gap:6px}
.ngrid.list .card{flex-direction:row;align-items:center;gap:14px;padding:8px;border-bottom:1px solid var(--line)}
.ngrid.list .thumb{width:54px;flex:none}
.ngrid.list .thumb .star{display:none}
.ngrid.list .card .d{margin:0 0 0 auto}
.empty{color:var(--muted);padding:30px 0;font-size:16px;max-width:52ch}
.fab{position:fixed;right:34px;bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:16px;z-index:5}
.fab .big{width:72px;height:72px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(31,122,224,.4);cursor:pointer}
.fab .big svg.i{width:34px;height:34px;stroke-width:2.2}
.fab .sm{width:56px;height:56px;border-radius:50%;border:0;background:var(--panel);color:var(--accent);display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer}
.fab .sm svg.i{width:26px;height:26px}
.drop-hint{position:fixed;inset:12px;border:3px dashed var(--accent);border-radius:28px;background:rgba(31,122,224,.08);display:grid;place-items:center;z-index:40;pointer-events:none;font-size:22px;font-weight:600;color:var(--accent);text-align:center;padding:16px}
@media (max-width:800px){
  #library{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;gap:4px}
  .side .logo{margin:0 8px 0 0;font-size:20px}.side .logo svg{width:24px;height:24px}
  .navb{width:auto;white-space:nowrap;padding:8px 10px;font-size:15px}
  .navb .cnt,.tree-h{display:none}
  .side-bottom{margin:0;padding:0;border:0;flex-direction:row}
  .main{margin:0;border-radius:22px 22px 0 0;padding:20px 16px 120px}
  .mhead h1{font-size:26px}
  .fab{right:18px}
}

/* ---------- notebook ---------- */
#editor{height:100%;display:flex;flex-direction:column;background:var(--desk)}
.ebar{display:flex;align-items:center;gap:6px;padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top,0px));background:var(--bar);border-bottom:1px solid var(--bar-line);min-height:58px}
.eb-l,.eb-r{display:flex;align-items:center;gap:2px;flex:none}
.eb-c{flex:1;display:flex;justify-content:center;gap:4px;overflow-x:auto;min-width:0;scrollbar-width:none}
.eb-c::-webkit-scrollbar{display:none}
.ebar .ib svg.i{width:27px;height:27px}
.ebar .tool{color:var(--ico-off)}
.ebar .tool[aria-pressed="true"]{color:var(--ico-on);background:rgba(255,255,255,.65)}
:root[data-theme="dark"] .ebar .tool[aria-pressed="true"]{background:rgba(255,255,255,.08)}
.ebar .tool .sw-dot{position:absolute;bottom:4px;left:50%;width:14px;height:3px;border-radius:2px;transform:translateX(-50%)}
.esub{display:flex;align-items:center;gap:12px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:48px}
.title-in{width:min(260px,40vw);font-weight:600;font-size:16px;border:0;background:transparent;padding:6px 8px;border-radius:8px}
.title-in:focus{outline:2px solid var(--accent-soft)}
.sub-opts{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:1;min-width:0}
.seg{display:flex;gap:2px;background:var(--panel-2);padding:3px;border-radius:10px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.swatches{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;flex:none}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.sw.custom{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.size{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.size input{width:120px;accent-color:var(--accent)}
.size i{display:block;border-radius:50%;background:var(--fg);flex:none}
.hint{color:var(--muted);font-size:14px}
.ebody{flex:1;min-height:0;display:flex}
.rail{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;background:var(--bar);border-right:1px solid var(--bar-line);overflow-y:auto}
.rail .ib svg.i{width:30px;height:30px}
.rail .sep{width:36px;height:1px;background:var(--bar-line);margin:4px 0}
.rail .ib.on{background:rgba(255,255,255,.7)}
.rail .ib.rec{color:var(--danger)}
.rail .grow{flex:1}
.rail-open{position:absolute;left:0;bottom:16px;z-index:6;width:30px;height:44px;border-radius:0 12px 12px 0;border:1px solid var(--bar-line);border-left:0;background:var(--bar);color:var(--ico);display:grid;place-items:center;cursor:pointer}
.split{flex:1;min-width:0;min-height:0;display:flex;--split:46%}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
#srcPane{flex:0 0 var(--split);background:var(--panel-2)}
#notePane{flex:1 1 0}
#divider{flex:0 0 12px;cursor:col-resize;background:var(--desk);display:grid;place-items:center;touch-action:none}
#divider::after{content:"";width:4px;height:44px;border-radius:2px;background:var(--line)}
@media (orientation:portrait),(max-width:720px){.split{flex-direction:column}#divider{cursor:row-resize}#divider::after{width:44px;height:4px}}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage.dark{background:#0F1216}
.stage video,.stage iframe{width:100%;height:100%;border:0;display:block;background:#0F1216;object-fit:contain}
.ctrl{display:flex;align-items:center;gap:6px;padding:8px 12px;flex-wrap:wrap;background:var(--panel);border-top:1px solid var(--line)}
.ctrl .btn{height:34px;padding:0 10px;font-size:14px}
.ctrl .btn.icon{width:34px;padding:0}
.ctrl .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:4.5em}
.grow{flex:1}
.chooser{width:100%;max-width:560px;padding:24px 16px;display:flex;flex-direction:column;gap:14px;overflow:auto;max-height:100%}
.ch-title{font-weight:700;font-size:19px;margin:0}
.ch-msg{margin:0;color:var(--danger);font-size:14px}
.ch-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;text-align:left}
.opt svg.i{width:26px;height:26px;color:var(--accent);margin-bottom:4px}
.opt span{color:var(--muted);font-size:13px}
.yt{display:flex;flex-direction:column;gap:6px}
.yt label{font-weight:500;font-size:14px}
.yt-row{display:flex;gap:8px}
.yt-row input,.field{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--panel)}
.yt-fb{position:absolute;left:12px;right:12px;bottom:12px;background:var(--panel);border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:var(--shadow)}
.yt-fb a{color:var(--accent)}
.pdf-scroll{position:relative;width:100%;height:100%;overflow:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px}
.pdf-page{width:100%;max-width:900px;background:#fff;box-shadow:var(--shadow);flex:none}
.pdf-page canvas{display:block;width:100%;height:100%}

.scroller{flex:1;min-height:0;overflow:auto;padding:22px 12px 120px;position:relative;background:var(--desk)}
.paper{position:relative;margin:0 auto;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.paper canvas{position:absolute;left:0;top:0;pointer-events:none}
.layer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.page{position:absolute;left:0;width:100%;background-color:#fff;box-shadow:0 1px 3px rgba(25,40,70,.16),0 3px 14px rgba(25,40,70,.06);overflow:hidden;
  --rl:rgba(80,120,170,.26);--ml:#EBA79C;--gl:rgba(70,100,140,.17)}
.page img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-drag:none}
.page .pno{position:absolute;right:10px;bottom:6px;font-size:11px;color:#9AA4B1;font-variant-numeric:tabular-nums}
.p-lines{background-image:repeating-linear-gradient(180deg,transparent 0 calc(var(--rh) - 1px),var(--rl) calc(var(--rh) - 1px) var(--rh))}
.p-margin{background-image:linear-gradient(90deg,transparent var(--mx),var(--ml) var(--mx) calc(var(--mx) + 1.5px),transparent 0),repeating-linear-gradient(180deg,transparent 0 calc(var(--rh) - 1px),var(--rl) calc(var(--rh) - 1px) var(--rh))}
.p-margin2{background-image:linear-gradient(90deg,transparent var(--mx),var(--ml) var(--mx) calc(var(--mx) + 1.5px),transparent 0 var(--mx2),var(--ml) var(--mx2) calc(var(--mx2) + 1.5px),transparent 0),repeating-linear-gradient(180deg,transparent 0 calc(var(--rh) - 1px),var(--rl) calc(var(--rh) - 1px) var(--rh))}
.p-cornell{background-image:linear-gradient(90deg,transparent var(--cx),var(--ml) var(--cx) calc(var(--cx) + 2px),transparent 0),linear-gradient(180deg,transparent var(--cy),var(--ml) var(--cy) calc(var(--cy) + 2px),transparent 0),repeating-linear-gradient(180deg,transparent 0 calc(var(--rh) - 1px),var(--rl) calc(var(--rh) - 1px) var(--rh))}
.p-grid{background-image:linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px);background-size:var(--rh) var(--rh)}
.p-dots{background-image:radial-gradient(circle,rgba(60,80,110,.45) 0 1.3px,transparent 1.8px);background-size:var(--rh) var(--rh)}
.item{position:absolute;pointer-events:none}
.m-lasso .item,.m-text .item{pointer-events:auto;touch-action:none}
.item .tx{display:block;white-space:pre-wrap;word-break:break-word;outline:none;min-height:1em;-webkit-user-select:text;user-select:text;font-family:var(--f-ui)}
.m-text .item.text .tx{cursor:text;box-shadow:0 0 0 1px rgba(31,122,224,.35);border-radius:3px;min-width:3em}
.m-text .item.text .tx:focus{box-shadow:0 0 0 2px #1F7AE0}
.item.img img{display:block;width:100%;pointer-events:none;-webkit-user-drag:none;border-radius:2px}
.item.sticker .tx{line-height:1}
.chip{display:inline-flex;align-items:center;gap:.3em;padding:.12em .6em .12em .45em;border-radius:999px;background:#E3EFFD;color:#1F7AE0;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.4;font-family:var(--f-ui)}
.chip svg{width:1em;height:1em;fill:currentColor}
.item.img .chip{position:absolute;left:6px;bottom:6px;font-size:13px}
.m-lasso .item.sel{outline:2px dashed #1F7AE0;outline-offset:4px}
.item .x,.item .handle{display:none}
.m-lasso .item.sel .x{display:grid;place-items:center;position:absolute;right:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:#D93025;color:#fff;border:2px solid #fff;font-size:17px;line-height:1;cursor:pointer;padding:0}
.m-lasso .item.sel .handle{display:block;position:absolute;right:-11px;bottom:-11px;width:22px;height:22px;border-radius:50%;background:#1F7AE0;border:2px solid #fff;cursor:nwse-resize}
#selBox{position:absolute;border:2px dashed #E8A93B;outline:2px dashed rgba(31,122,224,.55);outline-offset:-2px;background:rgba(255,190,140,.10);touch-action:none;cursor:move;z-index:3}
.selbar{position:absolute;left:50%;top:-52px;transform:translateX(-50%);display:flex;gap:2px;background:#1C2533;border-radius:12px;padding:4px;box-shadow:var(--shadow);white-space:nowrap}
.selbar button{border:0;background:transparent;color:#fff;padding:7px 11px;border-radius:8px;cursor:pointer;font-size:14px}

    try { await ensureInbox(); await pullInbox(); } catch (e) { console.warn('inbox', e); }
    lastSync = Date.now(); syncState = 'ok'; syncErr = '';
    if (pulledOpen === 'deleted') { note = null; showLibrary(); toast('Эту заметку удалили на другом устройстве'); }
    else if (pulledOpen && !pulledOpen.trashed) reloadOpen(pulledOpen);
    if (pulledAny && !$('#library').hidden) { await refreshDocs(); renderLibrary(); }
  } catch (e) {
    console.warn(e); syncState = 'err';
    syncErr = /fetch|network|load/i.test(e.message || '') ? 'Нет интернета, синхронизирую позже' : (e.message || String(e));
  } finally { syncing = false; renderSyncUI(); if (syncAgain) { syncAgain = false; syncSoon(); } }
}
/* files sent from the iPad share sheet through the "В Конспект" shortcut land in the inbox table */
let inboxCode = null;
async function ensureInbox() {
  if (!sb || !user) return null; if (inboxCode) return inboxCode;
  const { data, error } = await sb.from('inbox_codes').select('code').eq('user_id', user.id).maybeSingle(); if (error) throw error;
  if (data) return inboxCode = data.code;
  const code = (window.crypto && crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '') : uid() + uid()).slice(0, 24);
  const { error: e2 } = await sb.from('inbox_codes').insert({ user_id: user.id, code }); if (e2) throw e2;
  return inboxCode = code;
}
async function pullInbox() {
  if (!inboxCode) return;
  const { data, error } = await sb.from('inbox').select('id,name,data').order('id'); if (error) throw error;
  for (const r of data) {
    try {
      const bin = atob((r.data || '').replace(/[^A-Za-z0-9+/=]/g, '')); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      const pdf = bin.startsWith('%PDF'), type = pdf ? 'application/pdf' : bin.startsWith('\x89PNG') ? 'image/png' : 'image/jpeg';
      let name = String(r.name || 'Документ').trim() || 'Документ'; if (pdf && !/\.pdf$/i.test(name)) name += '.pdf';
      await importFilesAsNotes([new File([u8], name, { type })], { open: $('#editor').hidden });
      toast('Пришёл файл «' + name.replace(/\.pdf$/i, '') + '»', 4000);
    } catch (e) { console.warn('inbox item', e); }
    await sb.from('inbox').delete().eq('id', r.id);
  }
}
function copyBtn(text) { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = 'Скопировать'; b.onclick = async () => { try { await navigator.clipboard.writeText(text); b.textContent = 'Скопировано'; } catch { toast('Выделите текст и скопируйте вручную'); } setTimeout(() => { b.textContent = 'Скопировать'; }, 1500); }; return b; }
async function shareSetupDlg() {
  let code = null; try { code = await ensureInbox(); } catch (e) { console.warn(e); }
  if (!code) { toast('Сначала войдите в синхронизацию и подключитесь к интернету'); return; }
  modal((b, close) => {
    const url = SYNC.url + '/rest/v1/inbox';
    const val = (label, v) => { const r = document.createElement('div'); r.className = 'kv'; r.innerHTML = `<span>${esc(label)}</span><code>${esc(v)}</code>`; r.append(copyBtn(v)); return r; };
    b.innerHTML = `<h2>Файлы через «Поделиться»</h2>
      <p>Обычные сайты-приложения Apple не пускает в меню «Поделиться». Поэтому делаем одну Быструю команду «В Конспект»: она появится в этом меню и перешлёт файл сюда. Настраивается один раз, минут 5.</p>
      <ol class="steps">
        <li>Откройте приложение <b>«Быстрые команды»</b> и нажмите <b>«+»</b>. Назовите команду <b>«В Конспект»</b>.</li>
        <li>Нажмите <b>ⓘ</b> (или стрелку у названия) и включите <b>«Показывать в меню „Поделиться“»</b>. Типы входа: <b>PDF</b> и <b>Изображения</b>.</li>
        <li>Добавьте действие <b>«Кодировать в Base64»</b> (поиск: base64). Вход — <b>«Ввод быстрой команды»</b>. Нажмите стрелку и выберите <b>«Разрывы строк: Нет»</b>.</li>
        <li>Добавьте действие <b>«Получить содержимое URL»</b>. Вставьте адрес ниже. Нажмите стрелку: <b>Метод — POST</b>.</li>
        <li>В <b>Заголовках</b> добавьте три строки: <b>apikey</b> — ключ ниже; <b>Content-Type</b> — <code>application/json</code>; <b>Prefer</b> — <code>return=minimal</code>.</li>
        <li><b>Тело запроса — JSON</b>, три поля типа «Текст»: <b>code</b> — код ниже; <b>name</b> — переменная «Ввод быстрой команды» → «Имя»; <b>data</b> — переменная «Кодировано в Base64».</li>
        <li>По желанию добавьте <b>«Показать уведомление»</b> с текстом «Отправлено в Конспект».</li>
      </ol>
      <div id="kvs"></div>
      <p>Как пользоваться: на сайте Еголенда «Поделиться» → «В Конспект», потом откройте «Конспект» — файл появится новой заметкой, на которой можно писать.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn primary" type="button" data-a="c">Понятно</button></div>`;
    const kv = b.querySelector('#kvs'); kv.append(val('Адрес (URL)', url), val('apikey', SYNC.key), val('code — ваш личный код', code));
    b.querySelector('[data-a="c"]').onclick = close;
  }, 'dlg wide');
}
function reloadOpen(n) {
  const oldSrc = JSON.stringify(note.source || null), top = scroller.scrollTop;
  note = n; undoS = []; redoS = []; sel = null; clearSel(true); updUR();
  $('#titleIn').value = n.title; layout(); renderItems(); scroller.scrollTop = top;
  if (!$('#srcPane').hidden && JSON.stringify(n.source || null) !== oldSrc) loadSource();
  toast('Заметка обновлена с другого устройства');
}
function syncLabel() {
  if (!user) return 'Войти для синхронизации';
  if (syncState === 'busy') return 'Синхронизирую…';
  if (syncState === 'err') return syncErr || 'Ошибка синхронизации';
  if (lastSync) return 'Синхронизировано в ' + new Date(lastSync).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  return 'Синхронизация';
}
function renderSyncUI() {
  const cls = !user ? '' : syncState;
  const nav = $('#syncNav'); nav.hidden = !SYNC.url;
  nav.innerHTML = ICON.cloud + `<span>${user ? 'Синхронизация' : 'Войти'}</span><span class="cnt" style="display:flex;align-items:center;gap:6px"><span class="dot ${cls}" style="position:static"></span></span>`; nav.title = syncLabel();
  const mini = document.getElementById('syncMini'); if (mini) { mini.title = syncLabel(); const d = mini.querySelector('.dot') || mini.appendChild(document.createElement('span')); d.className = 'dot ' + cls; }
  if (syncBox && syncBox.isConnected) renderSyncDlg();
}
$('#syncNav').onclick = () => openSyncDlg();
let dlgMsg = '';
function openSyncDlg() { modal(b => { syncBox = b; renderSyncDlg(); const e = b.querySelector('#authEmail'); if (e) setTimeout(() => e.focus(), 30); }); }
function renderSyncDlg() {
  const b = syncBox; if (!b) return;
  if (!sb) b.innerHTML = `<h2>Синхронизация</h2><p>${esc(syncErr || 'Подключаюсь…')}</p><div class="row"><button class="btn" type="button" data-a="close">Закрыть</button></div>`;
  else if (!user) {
    b.innerHTML = `<h2>Синхронизация</h2>
      <p>Войдите, и заметки появятся на всех ваших устройствах. Видео и аудиозаписи не переносятся, остальное переносится.</p>
      <form id="authForm" style="display:flex;flex-direction:column;gap:10px">
        <label>Почта<input class="field" id="authEmail" type="email" autocomplete="username" required></label>
        <label>Пароль, от 6 символов<input class="field" id="authPass" type="password" autocomplete="current-password" minlength="6" required></label>
        ${dlgMsg ? `<p class="err">${esc(dlgMsg)}</p>` : ''}
        <div class="row"><button class="btn primary" type="submit">Войти</button><button class="btn" type="button" data-a="up">Создать аккаунт</button><button class="btn ghost" type="button" data-a="close">Закрыть</button></div>
      </form>`;
  } else {
    b.innerHTML = `<h2>Синхронизация</h2><p>Вы вошли как</p><div style="font-weight:600;word-break:break-all">${esc(user.email || '')}</div>
      <p${syncState === 'err' ? ' class="err"' : ''}>${esc(syncLabel())}</p>
      <div class="row"><button class="btn primary" type="button" data-a="now">Синхронизировать сейчас</button><button class="btn" type="button" data-a="share">Файлы через «Поделиться»</button><button class="btn" type="button" data-a="out">Выйти</button><button class="btn ghost" type="button" data-a="close">Закрыть</button></div>`;
  }
  b.querySelectorAll('[data-a]').forEach(btn => { btn.onclick = () => dlgAction(btn.dataset.a); });
  const f = b.querySelector('#authForm'); if (f) f.onsubmit = e => { e.preventDefault(); dlgAction('in'); };
}
const authErr = m => /Invalid login/i.test(m) ? 'Неверная почта или пароль' : /already registered/i.test(m) ? 'Такой аккаунт уже есть. Нажмите «Войти»' : /at least 6/i.test(m) ? 'Пароль должен быть не короче 6 символов' : m;
async function dlgAction(a) {
  if (a === 'close') { const o = syncBox && syncBox.closest('.overlay'); if (o) o.remove(); syncBox = null; dlgMsg = ''; return; }
  if (a === 'now') { syncNow(); return; }
  if (a === 'share') { dlgAction('close'); shareSetupDlg(); return; }
  if (a === 'out') { await sb.auth.signOut(); user = null; syncState = 'off'; renderSyncUI(); return; }
  const email = (syncBox.querySelector('#authEmail').value || '').trim(), password = syncBox.querySelector('#authPass').value || '';
  if (!email || password.length < 6) { dlgMsg = 'Введите почту и пароль от 6 символов'; renderSyncDlg(); syncBox.querySelector('#authEmail').value = email; return; }
  dlgMsg = '';
  const res = a === 'up' ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  if (res.error) { dlgMsg = authErr(res.error.message); renderSyncDlg(); syncBox.querySelector('#authEmail').value = email; return; }
  user = res.data.session.user; renderSyncUI(); toast('Готово, синхронизирую заметки'); syncNow();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 90000);
